version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: crypto_intel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    depends_on:
      - api
      - frontend
    networks:
      - crypto_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_intel_api_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/crypto_intel?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crypto_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_intel_frontend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME}/api/v1
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN_NAME}/api/v1/ws
    depends_on:
      - api
    networks:
      - crypto_network

  postgres:
    image: postgres:16-alpine
    container_name: crypto_intel_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_intel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_network

  redis:
    image: redis:7.2-alpine
    container_name: crypto_intel_redis_prod
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_network

networks:
  crypto_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  certbot_data:
